version: '3.8'

services:
  web:
    build: .
    command: python3 manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    
  bot:
    build: .
    command: python3 -m bot polling
    volumes:
      - .:/app
    env_file:
      - .env

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: avtowallet_db
      POSTGRES_USER: avtowallet_admin
      POSTGRES_PASSWORD: 4321aVToWaLLet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - .env
    restart: always

volumes:
  postgres_data:
